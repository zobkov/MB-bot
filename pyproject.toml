[project]
name = "mb-conf-bot"
version = "0.1.0"
description = "Telegram Bot Конференции «Менеджмент Будущего» 2026"
authors = [
    {name = "Artyom Zobkov"}
]
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram (>=3.17.0,<4.0.0)",
    "aiogram-dialog (>=2.4.0,<3.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "environs (>=11.0.0,<15.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "greenlet (>=3.1.0,<4.0.0)",
]

[tool.poetry]
packages = [
    { include = "bot" },
    { include = "config" },
    { include = "database" },
    { include = "services" },
    { include = "utils" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
